# ----------------------------------------
# 1. ESSENTIAL VARIABLES
# ----------------------------------------
# Set "Windows" key as main modifier
$mainMod = SUPER 

# Set programs that you use
$terminal = alacritty
$fileManager = thunar
$menu = wofi --show drun
$code = antigravity
$browser = brave-browser
$music = cider
$screenshot = ~/.local/bin/screenshot-region
################
### MONITORS ###
################
# Check 'hyprctl monitors' for the exact name if 'preferred' causes issues.
monitor=,preferred,auto,1.25


#############################
### ENVIRONMENT VARIABLES ###
#############################
# Necessary environment variables for cursor size and Wayland functionality
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

# ----------------------------------------
# 2. AUTOSTART
# ----------------------------------------
# Autostart necessary processes (notifications daemon and status bar)
exec-once = mako & 
exec-once = hyprpaper &
exec-once = waybar & 
exec-once = wl-paste --type text --watch cliphist store# Optional: Wallpaper utility
exec-once = ~/.config/hypr/scripts/monitor_hotplug.sh
# exec-once = hyprpaper & 
# exec-once = nm-applet & 

# ----------------------------------------
# 3. LOOK AND FEEL (Minimal & Fast)
# ----------------------------------------

# General Tiling and Gaps
general {
    gaps_in = 0
    gaps_out = 0

    border_size = 1
    $mainColor = rgb(89B4FA) # Catppuccin Frappe Blue
    $secondaryColor = rgb(89F5FF) # Catppuccin Frappe Yellow

    # Simple, solid colors for borders
    col.active_border = $mainColor $secondaryColor 45deg ; # <--- New: Gradient
    col.inactive_border = $secondaryColor

    resize_on_border = false
    allow_tearing = false
    layout = dwindle
}

# Decoration
decoration {
    rounding = 0
    
    # Ensure active/inactive opacity is full
    active_opacity = 1.0
    inactive_opacity = 1.0

    # Minimal Blur (for transparency effects)
    blur {
        enabled = true
        size = 3
        passes = 1
    }

    # Shadow disabled for max speed/minimalism
    shadow {
        enabled = false
    }
}

# Animations (DISABLED for maximum speed/minimalism)
animations {
    enabled = no
    # All other animation rules are ignored when 'enabled = no'
}


# Dwindle Layout Specifics
dwindle {
    pseudotile = true # Bound to $mainMod + P
    preserve_split = true 
}

# Master Layout Specifics (useful if you switch layouts)
master {
    new_status = master
}

# Misc Settings
misc {
    force_default_wallpaper = -1
    disable_hyprland_logo = true
}

xwayland{
	force_zero_scaling=true
}

# ----------------------------------------
# 4. INPUT SETTINGS
# ----------------------------------------
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1 # Focus on window when mouse enters
    sensitivity = 0

    touchpad {
        natural_scroll = true
    }
}

# Touchpad Gesture
gesture = 3, horizontal, workspace


# ----------------------------------------
# 5. KEYBINDINGS
# ----------------------------------------

# Application Execution
bind = $mainMod, return, exec, $terminal
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, space, exec, $menu
bind = $mainMod, C, exec, $code
bind = $mainMod, B, exec, $browser
bind = $mainMod, M, exec, $music
bind = $mainMod, V, exec, ~/.local/bin/wofi-clipboard
# bind = SUPER+SHIFT+4, exec, $screenshot

# Window Management
bind = $mainMod, Q, killactive,
bind = $mainMod, T, togglefloating,
bind = $mainMod, L, exit, # Exit Hyprland

# Tiling/Dwindle
bind = $mainMod, P, pseudo, # Toggle pseudo-tiling
bind = $mainMod, J, togglesplit, # Toggle split direction

# Focus Movement (H, J, K, L is recommended for better muscle memory)
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Workspace Switching (1-10)
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move Window to Workspace (SHIFT + 1-10)
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Scroll to switch workspaces
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mouse (LMB/RMB drag)
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Multimedia Keys (Volume and Brightness)
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Media Control
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic
